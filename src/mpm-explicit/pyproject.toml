[project]
name = "mpm-explicit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kiinami", email = "kinami@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "nvtx>=0.2.16",
    "rerun-sdk>=0.35.0",
    "rich>=15.0.0",
    "trimesh>=5.0.0",
    "warp-lang>=1.15.0",
]

[project.scripts]
mpm-explicit = "mpm_explicit.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
# MPM numerics kernels follow the notation of Stomakhin et al. 2013:
# deformation gradients F, Jacobians J, rotations R, SVD factors U/V, identity I.
"src/**" = ["N806"]
